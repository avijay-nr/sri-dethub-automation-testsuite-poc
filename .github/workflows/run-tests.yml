name: SRI Playwright Tests

on:
  push:
    branches:
      - vinay-sri-localbranch
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to run tests on'
        required: true
        default: 'vinay-sri-localbranch'
      tags:
        description: 'Test tag to run (leave empty for Full Regression)'
        required: false
        default: ''

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run Playwright tests
        run: |
          if [ -n "${{ github.event.inputs.tags }}" ]; then
            npx playwright test --grep "${{ github.event.inputs.tags }}" --reporter=html,json
          else
            npx playwright test --reporter=html,json
          fi
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: playwright-report/results.json

      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/

      - name: Publish Test Summary
        if: always()
        run: |
          echo "## Playwright Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f playwright-report/results.json ]; then
            passed=$(python3 -c "import json; d=json.load(open('playwright-report/results.json')); print(d['stats']['expected'])")
            failed=$(python3 -c "import json; d=json.load(open('playwright-report/results.json')); print(d['stats']['unexpected'])")
            skipped=$(python3 -c "import json; d=json.load(open('playwright-report/results.json')); print(d['stats']['skipped'])")
            echo "| Status  | Count |" >> $GITHUB_STEP_SUMMARY
            echo "|---------|-------|" >> $GITHUB_STEP_SUMMARY
            echo "| Passed  | $passed |" >> $GITHUB_STEP_SUMMARY
            echo "| Failed  | $failed |" >> $GITHUB_STEP_SUMMARY
            echo "| Skipped | $skipped |" >> $GITHUB_STEP_SUMMARY
          else
            echo "Tests completed! See artifacts for full report." >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Full HTML Report: Download from Artifacts section below." >> $GITHUB_STEP_SUMMARY