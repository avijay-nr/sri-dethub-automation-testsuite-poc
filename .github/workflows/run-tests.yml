name: 🧪 SRI - Detection Hub Tests

on:
  workflow_dispatch:
    inputs:
      environment:
        description: '🌍 Target Environment'
        required: true
        type: choice
        options:
          - QA-TEST
          - QA-DEV
          - custom
        default: 'QA-TEST'
      custom_url:
        description: '🔗 Custom URL (only if environment = custom)'
        required: false
        type: string
        default: ''
      tags:
        description: '🏷️ Test Tags'
        required: true
        type: choice
        options:
          - '@smoke'
          - '@regression'
          - '@login'
          - custom
        default: '@smoke'
      custom_tag:
        description: '🔖 Custom Tag (only if tags = custom). Example: @login_TC001'
        required: false
        type: string
        default: ''

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🎭 Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: 🧪 Run Tests
        env:
          TEST_ENV: ${{ inputs.environment }}
          CUSTOM_URL: ${{ inputs.custom_url }}
          DETHUB_USERNAME: ${{ secrets.DETHUB_USERNAME }}
          DETHUB_PASSWORD: ${{ secrets.DETHUB_PASSWORD }}
        run: |
          echo "╔══════════════════════════════════════════════════╗"
          echo "║   🧪 SRI - DETECTION HUB TEST EXECUTION         ║"
          echo "╠══════════════════════════════════════════════════╣"
          echo "║ 🌍 Environment : ${{ inputs.environment }}"
          echo "║ 🏷️  Tags        : ${{ inputs.tags }}"
          echo "║ 👤 Triggered by: ${{ github.actor }}"
          echo "║ 🕐 Started at  : $(date '+%Y-%m-%d %H:%M:%S UTC')"
          echo "╚══════════════════════════════════════════════════╝"
          echo ""
          echo "🚀 Starting test execution..."
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          TAG="${{ inputs.tags }}"
          if [ "$TAG" = "custom" ]; then
            TAG="${{ inputs.custom_tag }}"
          fi
          npx playwright test --grep "$TAG"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "✅ Test execution completed!"

      - name: 📊 Set Report URL
        if: always()
        run: |
          REPO_NAME="${{ github.event.repository.name }}"
          OWNER="${{ github.repository_owner }}"
          RUN_ID="${{ github.run_id }}"
          PAGES_URL="https://${OWNER}.github.io/${REPO_NAME}/reports/${RUN_ID}"
          echo "PAGES_URL=$PAGES_URL" >> $GITHUB_ENV

      - name: 📊 Generate Test Summary
        if: always()
        run: |
          if [ ! -f playwright-report/results.json ]; then
            echo "## ❌ No results.json found — tests may have crashed!" >> $GITHUB_STEP_SUMMARY
            exit 0
          fi

          PASSED=$(jq '.stats.expected // 0' playwright-report/results.json)
          FAILED=$(jq '.stats.unexpected // 0' playwright-report/results.json)
          FLAKY=$(jq '.stats.flaky // 0' playwright-report/results.json)
          SKIPPED=$(jq '.stats.skipped // 0' playwright-report/results.json)
          TOTAL=$((PASSED + FAILED + FLAKY + SKIPPED))

          if [ "$FAILED" -gt 0 ]; then
            OVERALL="❌ FAILED"
          elif [ "$FLAKY" -gt 0 ]; then
            OVERALL="⚠️ FLAKY"
          else
            OVERALL="✅ PASSED"
          fi

          cat >> $GITHUB_STEP_SUMMARY << EOF

          ## 📝 SRI - Detection Hub Test Results Summary

          ### 🏷️ Run Configuration

          | Parameter | Value |
          |-----------|-------|
          | 🌍 Environment | \`${{ inputs.environment }}\` |
          | 🏷️ Tags | \`${{ inputs.tags }}\` |
          | 👤 Triggered By | \`${{ github.actor }}\` |
          | 🏁 Overall | **${OVERALL}** |

          ---

          ### 🧪 Test Results

          | Status | Count |
          |--------|-------|
          | ✅ Passed | ${PASSED} |
          | ❌ Failed | ${FAILED} |
          | ⚠️ Flaky | ${FLAKY} |
          | ⏭️ Skipped | ${SKIPPED} |
          | 📊 Total | ${TOTAL} |

          ---

          ### 🔗 Reports

          | Link | Description |
          |------|-------------|
          | [📄 Live HTML Report](${{ env.PAGES_URL }}) | This run's Playwright report ✅ |

          EOF

      - name: 📤 Upload Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: detection-hub-report
          path: playwright-report/
          retention-days: 14

      - name: 🚀 Deploy Report to GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: playwright-report
          destination_dir: reports/${{ github.run_id }}
          keep_files: true

      - name: 🗑️ Cleanup Old Reports (keep last 10)
        if: always()
        run: |
          git clone --branch gh-pages --single-branch \
            https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git gh-pages-dir

          if [ -d gh-pages-dir/reports ]; then
            cd gh-pages-dir/reports
            REPORT_COUNT=$(ls -t | wc -l)
            echo "📁 Total reports found: $REPORT_COUNT"

            if [ "$REPORT_COUNT" -gt 10 ]; then
              echo "🧹 Cleaning up old reports, keeping latest 10..."
              ls -t | tail -n +11 | xargs -r rm -rf
              cd ..
              git config user.name "github-actions"
              git config user.email "actions@github.com"
              git add -A
              git diff --staged --quiet || git commit -m "chore: cleanup old reports (keep last 10)"
              git push
              echo "✅ Cleanup done!"
            else
              echo "✅ Only $REPORT_COUNT reports — no cleanup needed yet!"
            fi
          else
            echo "ℹ️ No reports directory found yet — skipping cleanup."
          fi